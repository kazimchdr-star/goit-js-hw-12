<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search Pixabay photos and explore them in a full-size gallery."
    />
    <title>Image Search</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234e75ff'/%3E%3Cpath d='m5 24 8-11 5 6 4-5 5 10Z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main class="container">
      <h1 class="visually-hidden">Image search</h1>
      <form class="form" autocomplete="off">
        <label class="visually-hidden" for="search-input">Search images</label>
        <input
          id="search-input"
          type="text"
          name="search-text"
          placeholder="Search images..."
          maxlength="100"
          required
        />
        <button type="submit">Search</button>
      </form>
      <p class="visually-hidden" id="search-status" role="status"></p>
      <ul
        class="gallery"
        aria-label="Image search results"
        aria-busy="false"
      ></ul>
      <button class="load-more" type="button" hidden>Load more</button>
      <div class="loading" role="status" hidden>
        <span class="loader" aria-hidden="true"></span>
        <span>Loading images, please wait...</span>
      </div>
      <p class="attribution" hidden>
        Photos from
        <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer"
          >Pixabay</a
        >
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
